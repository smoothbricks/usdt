name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  RUST_BACKTRACE: 1

jobs:
  style-check:
    name: Check Rust style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt -- --check

  stable-test:
    name: Run most tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "macos-15", "ubuntu-24.04-arm", "ubuntu-latest" ]
        # Test on MSRV and stable.
        toolchain: [ "1.88.0", "stable" ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: >
          cargo +${{ matrix.toolchain }} test
          --release
          --verbose
          --workspace
          --exclude compile-errors
          --no-fail-fast

  freebsd-test:
    name: Test on FreeBSD
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [ "1.88.0", "stable", "nightly-2025-05-05" ]
    steps:
      - uses: actions/checkout@v4
      - name: Test on FreeBSD
        uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          version: '14.1'
          shell: bash
          run: |
            export IGNORE_OSVERSION=yes
            sudo -E pkg update
            sudo -E pkg install -y curl security/ca_root_nss
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env

            # Enable DTrace kernel module and allow regular users to register probes
            sudo kldload dtraceall
            sudo chmod 666 /dev/dtrace/helper

            cargo +${{ matrix.toolchain }} test \
              --release \
              --verbose \
              --workspace \
              --no-fail-fast \
              --exclude compile-errors

  trybuild-test:
    name: Run trybuild tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "macos-15", "ubuntu-24.04-arm", "ubuntu-latest" ]
        # Test on the pinned rust-toolchain version.
        toolchain: [ "1.88.0" ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: >
          cargo +${{ matrix.toolchain }} test
          --release
          --verbose
          --package compile-errors
          --no-fail-fast

  stable-test-no-support:
    name: Test on DTrace-less systems
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "windows-latest" ]
        # Test on MSRV and stable.
        toolchain: [ "1.88.0", "stable" ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: >
          cargo +${{ matrix.toolchain }} test
          --release
          --verbose
          --workspace
          --exclude compile-errors
          --exclude does-it-work
          --exclude test-json
          --exclude test-unique-id
          --no-fail-fast

  stable-test-no-op:
    name: Test with probes disabled
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "macos-15" ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: >
          cargo +stable test
          --release
          --verbose
          --no-default-features
          --workspace
          --exclude does-it-work
          --exclude test-json
          --exclude test-unique-id
          --exclude compile-errors
          --no-fail-fast

  recent-nightly:
    name: Run tests on a recent nightly
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "macos-15", "ubuntu-24.04-arm", "ubuntu-latest" ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-05
      - run: >
          cargo +nightly-2025-05-05 test
          --release
          --verbose
          --workspace
          --exclude compile-errors
          --exclude dusty
          --no-fail-fast

  recent-nightly-no-support:
    name: Run tests on a recent nightly
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "windows-latest" ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-05
      - run: >
          cargo +nightly-2025-05-05 test
          --release
          --verbose
          --workspace
          --exclude compile-errors
          --exclude does-it-work
          --exclude test-json
          --exclude test-unique-id
          --exclude dusty
          --no-fail-fast

  cross-target-test:
    name: Cross-target probe generation (ARM64 macOS host, x86-64 Linux target)
    # macos-15 is an Apple-silicon runner: host architecture and OS both
    # differ from the x86_64-unknown-linux-gnu target, which is the point.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: cargo install --locked --version 0.23.4 cargo-zigbuild
      - run: test "$(uname -m)" = arm64
      # Native: build the consumers and the object checker, prove disabled
      # probe arguments are not evaluated, and prove the Mach-O objects
      # carry dtrace probe symbols (so laziness cannot pass as a no-op).
      - run: >
          cargo build
          --package cross-target-attr
          --package cross-target-macro
          --package cross-target-build
          --package cross-target-plain
          --package cross-target-check
      - run: >
          cargo test
          --package cross-target-attr
          --package cross-target-macro
          --package cross-target-build
          --package cross-target-check
      - run: |
          ./target/debug/cross-target-check --mach-o target/debug/libcross_target_attr.rlib crossattr:work crossattr:done
          ./target/debug/cross-target-check --mach-o target/debug/libcross_target_macro.rlib crossmacro:work crossmacro:done
          ./target/debug/cross-target-check --mach-o target/debug/libcross_target_build.rlib crossbuild:work crossbuild:done
          ./target/debug/cross-target-check --none target/debug/libcross_target_plain.rlib
      # Cross: libraries need no final target linker, but transitive psm assembly still needs a target C compiler.
      - run: >
          cargo zigbuild
          --target x86_64-unknown-linux-gnu
          --lib
          --package cross-target-attr
          --package cross-target-macro
          --package cross-target-build
          --package cross-target-plain
      - run: |
          ./target/debug/cross-target-check --stapsdt target/x86_64-unknown-linux-gnu/debug/libcross_target_attr.rlib 'crossattr:work=1@%dil 8@%rsi 4@%edx -4@%ecx' 'crossattr:done='
          ./target/debug/cross-target-check --stapsdt target/x86_64-unknown-linux-gnu/debug/libcross_target_macro.rlib 'crossmacro:work=1@%dil 8@%rsi 8@%rdx -4@%ecx' 'crossmacro:done='
          ./target/debug/cross-target-check --stapsdt target/x86_64-unknown-linux-gnu/debug/libcross_target_build.rlib 'crossbuild:work=1@%dil 8@%rsi 8@%rdx -4@%ecx' 'crossbuild:done='
          ./target/debug/cross-target-check --none target/x86_64-unknown-linux-gnu/debug/libcross_target_plain.rlib
      # Oracle sensitivity: demanding instrumented records from the
      # uninstrumented consumer must fail.
      - run: |
          if ./target/debug/cross-target-check --stapsdt target/x86_64-unknown-linux-gnu/debug/libcross_target_plain.rlib 'crossattr:work=1@%dil 8@%rsi 4@%edx -4@%ecx'; then
            echo "checker accepted an uninstrumented object as instrumented" >&2
            exit 1
          fi
